version: '3.9'

services:
  # ── Base de datos ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hicloud_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-hicloud}
      POSTGRES_USER:     ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Higlobal4691}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout:   5s
      retries:   5
    networks:
      - hicloud_net

  # ── Backend NestJS ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./hi-cloud backend-project/backend
      dockerfile: Dockerfile
    container_name: hicloud_backend
    restart: unless-stopped
    environment:
      NODE_ENV:        production
      PORT:            3000
      DB_HOST:         postgres
      DB_PORT:         5432
      DB_USERNAME:     ${DB_USERNAME:-postgres}
      DB_PASSWORD:     ${DB_PASSWORD:-Higlobal4691}
      DB_NAME:         ${DB_NAME:-hicloud}
      JWT_SECRET:      ${JWT_SECRET:-hicloud_jwt_secret_change_in_prod}
      JWT_EXPIRES_IN:  ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN:     ${CORS_ORIGIN:-http://localhost}
      ECF_RNC_EMISOR:  ${ECF_RNC_EMISOR:-}
      ECF_RAZON_SOCIAL:${ECF_RAZON_SOCIAL:-HiCloud ERP}
      ECF_AMBIENTE:    ${ECF_AMBIENTE:-pruebas}
      SMTP_HOST:       ${SMTP_HOST:-}
      SMTP_PORT:       ${SMTP_PORT:-587}
      SMTP_USER:       ${SMTP_USER:-}
      SMTP_PASS:       ${SMTP_PASS:-}
      NOTIF_ADMIN_EMAIL:${NOTIF_ADMIN_EMAIL:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hicloud_net
    volumes:
      - uploads:/app/uploads

  # ── Frontend React ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./hi-cloud frontend-project
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: hicloud_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - hicloud_net

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hicloud_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hicloud_net

volumes:
  postgres_data:
  uploads:

networks:
  hicloud_net:
    driver: bridge
