name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. CI: TypeScript checks (ambos proyectos) ───────────────────────────────
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud backend-project/backend/package-lock.json'

      - name: Backend — TypeScript
        working-directory: 'hi-cloud backend-project/backend'
        run: npm ci && npx tsc --noEmit

      - name: Backend — Audit vulnerabilidades (S-39)
        working-directory: 'hi-cloud backend-project/backend'
        run: npm audit --audit-level=high || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud frontend-project/package-lock.json'

      - name: Frontend — TypeScript
        working-directory: 'hi-cloud frontend-project'
        run: npm ci && npx tsc --noEmit

      - name: Frontend — Audit vulnerabilidades (S-39)
        working-directory: 'hi-cloud frontend-project'
        run: npm audit --audit-level=high || true

  # ── 2. Build backend en el runner (sin límite de timeout en EC2) ─────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud backend-project/backend/package-lock.json'

      - name: Build
        working-directory: 'hi-cloud backend-project/backend'
        run: npm ci && npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: 'hi-cloud backend-project/backend/dist'
          retention-days: 1

  # ── 3. Build frontend en el runner (7GB RAM, sin timeout) ────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud frontend-project/package-lock.json'

      - name: Build
        working-directory: 'hi-cloud frontend-project'
        run: npm ci && npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_API_URL: /api/v1

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 'hi-cloud frontend-project/dist'
          retention-days: 1

  # ── 4. Deploy: SCP ambos dists + SSH mínimo en EC2 ───────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend-dist

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      # ── Subir frontend compilado ──────────────────────────────────────────────
      - name: Deploy frontend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     3.137.152.75
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source:   'frontend-dist/*'
          target:   '/var/www/hicloudrd.com/html/'
          strip_components: 1

      # ── Subir backend dist compilado (elimina la compilación en EC2) ──────────
      - name: Deploy backend dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     3.137.152.75
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source:   'backend-dist/*'
          target:   '/home/ubuntu/hicloud/backend-dist-ci/'
          strip_components: 1

      # ── EC2: solo git pull + env vars + deps + mv dist + migrate + restart ────
      - name: Setup + Migrate + Restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_CA_CERT:       ${{ secrets.DB_CA_CERT }}
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:      ${{ secrets.SMTP_SECURE }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SMTP_FROM:        ${{ secrets.SMTP_FROM }}
          NOTIF_ADMIN_EMAIL: ${{ secrets.NOTIF_ADMIN_EMAIL }}
        with:
          host:            3.137.152.75
          username:        ubuntu
          key:             ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs:            DB_CA_CERT,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,SMTP_FROM,NOTIF_ADMIN_EMAIL
          timeout:         900s
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/hicloud

            echo "━━━ [1/4] Git sync ━━━"
            git fetch origin main
            git reset --hard origin/main

            echo "━━━ [2/4] Variables de entorno críticas ━━━"
            ENV_FILE="hi-cloud backend-project/backend/.env"

            if grep -q '^APP_URL=' "$ENV_FILE" 2>/dev/null; then
              sed -i 's|^APP_URL=.*|APP_URL=https://hicloudrd.com|' "$ENV_FILE"
            else
              echo 'APP_URL=https://hicloudrd.com' >> "$ENV_FILE"
            fi

            if grep -q '^FRONTEND_URL=' "$ENV_FILE" 2>/dev/null; then
              sed -i 's|^FRONTEND_URL=.*|FRONTEND_URL=https://hicloudrd.com|' "$ENV_FILE"
            else
              echo 'FRONTEND_URL=https://hicloudrd.com' >> "$ENV_FILE"
            fi

            # S-25: DB_CA_CERT — usar el GitHub Secret (base64 del cert AWS RDS us-east-2).
            # Si el secret no está disponible (vacío), preservar el valor existente en .env.
            if [ -n "$DB_CA_CERT" ]; then
              if grep -q '^DB_CA_CERT=' "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^DB_CA_CERT=.*|DB_CA_CERT=${DB_CA_CERT}|" "$ENV_FILE"
              else
                echo "DB_CA_CERT=${DB_CA_CERT}" >> "$ENV_FILE"
              fi
              echo "  ✅ DB_CA_CERT actualizado desde GitHub Secret (${#DB_CA_CERT} chars)"
            else
              echo "  ⚠️  DB_CA_CERT secret vacío — se preserva el valor existente en .env"
            fi

            if grep -q '^GOOGLE_CALLBACK_URL=' "$ENV_FILE" 2>/dev/null; then
              sed -i 's|^GOOGLE_CALLBACK_URL=.*|GOOGLE_CALLBACK_URL=https://hicloudrd.com/api/v1/auth/google/callback|' "$ENV_FILE"
            else
              echo 'GOOGLE_CALLBACK_URL=https://hicloudrd.com/api/v1/auth/google/callback' >> "$ENV_FILE"
            fi

            # ── SMTP (Email) — inyectar desde GitHub Secrets si están disponibles ──
            inject_env() {
              local key="$1" val="$2"
              [ -z "$val" ] && return   # secret vacío → preservar valor existente
              if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                # escapar | en el valor para sed
                local escaped; escaped=$(printf '%s\n' "$val" | sed 's|[&\\/]|\\&|g; s/|/\\|/g')
                sed -i "s|^${key}=.*|${key}=${escaped}|" "$ENV_FILE"
              else
                echo "${key}=${val}" >> "$ENV_FILE"
              fi
            }
            inject_env SMTP_HOST        "$SMTP_HOST"
            inject_env SMTP_PORT        "$SMTP_PORT"
            inject_env SMTP_SECURE      "$SMTP_SECURE"
            inject_env SMTP_USER        "$SMTP_USER"
            inject_env SMTP_PASS        "$SMTP_PASS"
            inject_env SMTP_FROM        "$SMTP_FROM"
            inject_env NOTIF_ADMIN_EMAIL "$NOTIF_ADMIN_EMAIL"

            echo "  ✅ APP_URL y FRONTEND_URL configurados"
            echo "  ✅ GOOGLE_CALLBACK_URL=$(grep '^GOOGLE_CALLBACK_URL=' $ENV_FILE)"

            # ── Chromium para Puppeteer (set +e: errores aquí no abortan deploy) ─
            echo "  → Configurando Chromium para generación PDF..."
            set +e
            # Instalar chromium-browser si no existe (Ubuntu 20.04 = .deb, 22.04 = snap ignorado)
            if ! command -v chromium-browser > /dev/null 2>&1 \
            && ! command -v google-chrome    > /dev/null 2>&1 \
            && ! command -v chromium         > /dev/null 2>&1; then
              apt-get install -y -q chromium-browser 2>/dev/null \
                || apt-get install -y -q chromium 2>/dev/null \
                || true
            fi
            CHROME_PATH=$(command -v google-chrome-stable 2>/dev/null \
              || command -v google-chrome    2>/dev/null \
              || command -v chromium-browser 2>/dev/null \
              || command -v chromium         2>/dev/null \
              || echo "")
            echo "  Chrome path: ${CHROME_PATH:-'no encontrado — se usará bundled Puppeteer'}"
            if [ -n "$CHROME_PATH" ]; then
              grep -q '^PUPPETEER_EXECUTABLE_PATH=' "$ENV_FILE" 2>/dev/null \
                && sed -i "s|^PUPPETEER_EXECUTABLE_PATH=.*|PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}|" "$ENV_FILE" \
                || echo "PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}" >> "$ENV_FILE"
              echo "  PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}"
            fi
            set -e
            # ─────────────────────────────────────────────────────────────────────

            echo "━━━ [3/4] Deps + dist (precompilado en CI) + migraciones + restart ━━━"
            BACKEND_DIR="/home/ubuntu/hicloud/hi-cloud backend-project/backend"
            cd "$BACKEND_DIR"

            # Verificar que la dist del CI llegó correctamente
            if [ ! -f /home/ubuntu/hicloud/backend-dist-ci/main.js ]; then
              echo "❌ Backend dist no recibido del CI — abortando"
              exit 1
            fi

            # Instalar dependencias (el build TypeScript ya viene del CI)
            npm ci 2>&1 | tail -3

            # Reemplazar dist/ con el build precompilado del CI
            rm -rf dist
            mv /home/ubuntu/hicloud/backend-dist-ci dist

            # Symlink sin espacios para PM2
            ln -sfn "$BACKEND_DIR" /home/ubuntu/hicloud/backend-current

            echo "  → Corriendo migraciones pendientes..."
            node -e "
              const { AppDataSource } = require('./dist/data-source');
              AppDataSource.initialize()
                .then(ds => ds.runMigrations({ transaction: 'each' }))
                .then(migs => {
                  if (migs.length === 0) { console.log('  ✅ Sin migraciones pendientes'); }
                  else { console.log('  ✅ Migraciones aplicadas:', migs.map(m=>m.name).join(', ')); }
                  process.exit(0);
                })
                .catch(err => { console.error('  ❌ Migración falló:', err.message); process.exit(1); });
            " || { echo '❌ Migraciones fallaron — deploy abortado'; exit 1; }

            # Reiniciar backend con el nuevo código
            if ! pm2 list | grep -q hicloud-backend; then
              pm2 start /home/ubuntu/hicloud/backend-current/dist/main.js \
                --name hicloud-backend \
                --cwd /home/ubuntu/hicloud/backend-current \
                --interpreter node
            else
              pm2 restart hicloud-backend --update-env
            fi
            pm2 save
            sleep 15

            echo "━━━ [4/4] Health check ━━━"

            STATUS=$(curl -sk https://hicloudrd.com/api/v1/health | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['data']['status'])" 2>/dev/null || echo "error")
            echo "Health: $STATUS"
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
              echo "Deploy exitoso — servidor healthy"
            else
              echo "Health check fallo: $STATUS"
              curl -sk https://hicloudrd.com/api/v1/health || true
              echo ""
              pm2 logs hicloud-backend --lines 100 --nostream 2>/dev/null || true
              exit 1
            fi
