name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (backend/frontend/all)'
        required: false
        default: 'all'

env:
  AWS_REGION:       ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY:     ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com
  BACKEND_IMAGE:    hicloud-backend
  FRONTEND_IMAGE:   hicloud-frontend
  ECS_CLUSTER:      hicloud-cluster
  BACKEND_SERVICE:  hicloud-backend-svc
  FRONTEND_SERVICE: hicloud-frontend-svc

jobs:
  # ── 1. Verificar que CI pasa ─────────────────────────────────────────────────
  ci-check:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check backend
        working-directory: hi-cloud backend-project/backend
        run: npm ci && npx tsc --noEmit
      - name: Check frontend
        working-directory: hi-cloud frontend-project
        run: npm ci && npx tsc --noEmit

  # ── 2. Build & Push Docker Images a ECR ─────────────────────────────────────
  build-backend:
    name: Build Backend Image
    needs: ci-check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push backend image
        id: build
        working-directory: hi-cloud backend-project/backend
        run: |
          IMAGE_TAG="${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -t "${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest" .
          docker push "$IMAGE_TAG"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest"
          echo "image=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build Frontend Image
    needs: ci-check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push frontend image
        id: build
        working-directory: hi-cloud frontend-project
        run: |
          IMAGE_TAG="${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_URL=/api/v1 \
            -t "$IMAGE_TAG" \
            -t "${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest" .
          docker push "$IMAGE_TAG"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest"
          echo "image=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ── 3. Deploy a ECS ──────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to ECS
    needs: build-backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition hicloud-backend \
            --query taskDefinition > task-def-backend.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-backend.json
          container-name:  hicloud-backend
          image:           ${{ needs.build-backend.outputs.image }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:  ${{ steps.task-def.outputs.task-definition }}
          service:          ${{ env.BACKEND_SERVICE }}
          cluster:          ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-frontend:
    name: Deploy Frontend to ECS
    needs: build-frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition hicloud-frontend \
            --query taskDefinition > task-def-frontend.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-frontend.json
          container-name:  hicloud-frontend
          image:           ${{ needs.build-frontend.outputs.image }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:  ${{ steps.task-def.outputs.task-definition }}
          service:          ${{ env.FRONTEND_SERVICE }}
          cluster:          ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ── 4. Notificación final ─────────────────────────────────────────────────────
  notify:
    name: Notify Deploy
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy status
        run: |
          if [ "${{ needs.deploy-backend.result }}" = "success" ] && [ "${{ needs.deploy-frontend.result }}" = "success" ]; then
            echo "✅ Deploy exitoso — commit ${{ github.sha }}"
          else
            echo "❌ Deploy fallido — backend: ${{ needs.deploy-backend.result }}, frontend: ${{ needs.deploy-frontend.result }}"
            exit 1
          fi
