name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. CI: TypeScript checks ─────────────────────────────────────────────────
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend — TypeScript
        working-directory: 'hi-cloud backend-project/backend'
        run: npm ci && npx tsc --noEmit

      - name: Frontend — TypeScript
        working-directory: 'hi-cloud frontend-project'
        run: npm ci && npx tsc --noEmit

  # ── 2. Build frontend en el runner (7GB RAM, sin timeout) ────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud frontend-project/package-lock.json'

      - name: Build
        working-directory: 'hi-cloud frontend-project'
        run: npm ci && npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_API_URL: /api/v1

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 'hi-cloud frontend-project/dist'
          retention-days: 1

  # ── 3. Deploy: SCP frontend + SSH backend ────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Deploy frontend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     3.137.152.75
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source:   'frontend-dist/*'
          target:   '/var/www/hicloudrd.com/html/'
          strip_components: 1

      - name: Deploy backend + health check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            3.137.152.75
          username:        ubuntu
          key:             ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          timeout:         600s
          command_timeout: 8m
          script: |
            set -e
            cd /home/ubuntu/hicloud

            echo "━━━ [1/3] Git pull ━━━"
            git pull origin main

            echo "━━━ [2/3] Build + restart backend ━━━"
            cd "hi-cloud backend-project/backend"
            NODE_OPTIONS='--max-old-space-size=1500' npm run build
            pm2 restart hicloud-backend --update-env
            pm2 save
            sleep 10

            echo "━━━ [3/3] Health check ━━━"
            STATUS=$(curl -sk https://hicloudrd.com/api/v1/health | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['data']['status'])" 2>/dev/null || echo "error")
            echo "Health: $STATUS"
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
              echo "✅ Deploy exitoso"
            else
              echo "❌ Health check falló: $STATUS"
              exit 1
            fi
