name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. CI: TypeScript checks ─────────────────────────────────────────────────
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend — TypeScript
        working-directory: 'hi-cloud backend-project/backend'
        run: npm ci && npx tsc --noEmit

      - name: Frontend — TypeScript
        working-directory: 'hi-cloud frontend-project'
        run: npm ci && npx tsc --noEmit

  # ── 2. Deploy via SSH a EC2 (PM2 + Nginx) ────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     3.137.152.75
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          timeout:  600s
          script: |
            set -e
            cd /home/ubuntu/hicloud

            echo "━━━ [1/5] Git pull ━━━"
            git pull origin main

            echo "━━━ [2/5] Build backend ━━━"
            cd "hi-cloud backend-project/backend"
            NODE_OPTIONS='--max-old-space-size=1500' npm run build

            echo "━━━ [3/5] Restart backend (PM2) ━━━"
            pm2 restart hicloud-backend --update-env
            pm2 save
            sleep 10

            echo "━━━ [4/5] Build + deploy frontend ━━━"
            cd /home/ubuntu/hicloud/hi-cloud\ frontend-project
            NODE_OPTIONS='--max-old-space-size=1500' npm run build
            sudo cp -r dist/* /var/www/hicloudrd.com/html/

            echo "━━━ [5/5] Health check ━━━"
            sleep 5
            STATUS=$(curl -sk https://hicloudrd.com/api/v1/health | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['status'])" 2>/dev/null || echo "error")
            echo "Health: $STATUS"
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
              echo "✅ Deploy exitoso"
            else
              echo "❌ Health check falló: $STATUS"
              exit 1
            fi
