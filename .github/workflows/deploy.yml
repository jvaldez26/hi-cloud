name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evitar deploys concurrentes que interfieren entre sí (npm ci, rm -rf dist, pm2 restart)
concurrency:
  group: production-v2
  cancel-in-progress: false

jobs:
  # ── 1. CI: TypeScript checks (ambos proyectos) ───────────────────────────────
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # El postinstall de puppeteer descarga Chrome (~150 MB) desde
      # storage.googleapis.com en cada `npm ci`. Aquí solo se hace typecheck:
      # nadie lanza un navegador, así que esa descarga es puro desperdicio —
      # y una dependencia de red externa capaz de tumbar el deploy entero.
      # Ya lo hizo: el deploy de 5fb6906f murió con
      #   "Failed to set up chrome v147.0.7727.57 ... server returned code 403"
      # sin que hubiera un solo cambio de código que lo justificara.
      # En producción puppeteer NO usa este Chrome: usa el chromium de apt vía
      # PUPPETEER_EXECUTABLE_PATH (ver el paso "Chromium para Puppeteer").
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      # Primero de todo: check de texto, sin dependencias ni entorno. Tarda
      # segundos y evita gastar 10 minutos de CI para descubrir al final que el
      # deploy iba a dejar una variable sin inyectar.
      - name: Deploy — variables inyectadas sincronizadas
        run: node .github/scripts/validate-deploy-envs.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud backend-project/backend/package-lock.json'

      - name: Backend — TypeScript
        working-directory: 'hi-cloud backend-project/backend'
        run: npm ci && npx tsc --noEmit

      - name: Backend — Audit vulnerabilidades (S-39)
        working-directory: 'hi-cloud backend-project/backend'
        run: npm audit --audit-level=high || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud frontend-project/package-lock.json'

      - name: Frontend — TypeScript
        working-directory: 'hi-cloud frontend-project'
        run: npm ci && npx tsc --noEmit

      - name: Frontend — Audit vulnerabilidades (S-39)
        working-directory: 'hi-cloud frontend-project'
        run: npm audit --audit-level=high || true

  # ── 2. Build backend en el runner (sin límite de timeout en EC2) ─────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    env:
      # Igual que en el job `ci`: aquí solo corre `nest build` (compilación TS).
      # No se lanza ningún navegador, así que el Chrome del postinstall sobra.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud backend-project/backend/package-lock.json'

      - name: Validar entidades TypeORM
        working-directory: 'hi-cloud backend-project/backend'
        run: |
          # Detecta @Column sin type: explícito donde el tipo TypeScript es una unión con null/undefined.
          # TypeORM 0.3.x + reflect-metadata emite Object para estos tipos → DataTypeNotSupportedError
          # en AppDataSource.initialize() aunque TypeScript compile sin errores.
          # Excluye FK columns (mirror @JoinColumn y decoradores @ManyToOne/@OneToOne).
          node scripts/validate-entity-types.js

      - name: Build
        working-directory: 'hi-cloud backend-project/backend'
        run: npm ci && npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: 'hi-cloud backend-project/backend/dist'
          retention-days: 1

  # ── 3. Build frontend en el runner (7GB RAM, sin timeout) ────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15   # +3 min para el paso de subida de source maps (con timeout propio)
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud frontend-project/package-lock.json'

      - name: Build
        working-directory: 'hi-cloud frontend-project'
        run: npm ci && npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_API_URL: /api/v1
          VITE_SENTRY_DSN:     ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # SENTRY_AUTH_TOKEN / ORG / PROJECT ya NO van aquí — eran para sentryVitePlugin
          # (desactivado). Ahora solo los usa el paso de subida de source maps más abajo.

      - name: "Subir source maps a Sentry (falla → deploy continúa)"
        # Diseño resistente: si sentry-cli se cuelga o falla, el job sigue.
        # Un problema de source maps no puede volver a bloquear producción.
        working-directory: 'hi-cloud frontend-project'
        timeout-minutes: 3
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:        ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:    ${{ secrets.SENTRY_PROJECT }}
        run: |
          # Inyectar debugIds en JS y .map → correlación automática sin depender del release
          npx @sentry/cli sourcemaps inject ./dist
          # Subir bajo el mismo release que Sentry.init() usará en el frontend
          npx @sentry/cli sourcemaps upload --release "$GITHUB_SHA" ./dist
          echo "✅ Source maps subidos al release $GITHUB_SHA"

      - name: "Borrar .map del dist (no exponer en producción)"
        # Siempre corre, incluso si la subida falló — los .map no deben llegar a EC2.
        working-directory: 'hi-cloud frontend-project'
        run: |
          COUNT=$(find ./dist -name '*.map' | wc -l)
          find ./dist -name '*.map' -delete
          echo "✅ $COUNT archivos .map eliminados del dist"

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 'hi-cloud frontend-project/dist'
          retention-days: 1

  # ── 4. Deploy: SCP ambos dists + SSH atómico en EC2 ──────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend-dist

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      # ── Subir frontend compilado ──────────────────────────────────────────────
      - name: Deploy frontend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     3.137.152.75
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source:   'frontend-dist/*'
          target:   '/var/www/hicloudrd.com/html/'
          strip_components: 1

      # ── Subir backend dist compilado (elimina la compilación en EC2) ──────────
      - name: Deploy backend dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     3.137.152.75
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source:   'backend-dist/*'
          target:   '/home/ubuntu/hicloud/backend-dist-ci/'
          strip_components: 1

      # ── Subir los scripts de respaldo ────────────────────────────────────────
      # Antes NO se subían. El script de backup esperaba vivir en
      # /home/ubuntu/scripts/ y llegaba ahí solo si alguien lo había copiado a
      # mano en su día. Un respaldo que depende de eso no es un respaldo: nadie
      # sabe si sigue ahí, ni si es la versión del repo o una de hace un año.
      #
      # Se copian primero a un directorio sin espacios: la ruta real es
      # "hi-cloud backend-project/scripts", y scp-action separa las fuentes por
      # comas y espacios — un espacio en la ruta la parte en dos y la subida
      # falla de una forma que no es obvia al leer el log.
      - name: Preparar scripts para SCP
        run: |
          mkdir -p scripts-deploy
          cp -r "hi-cloud backend-project/scripts/." scripts-deploy/
          ls -la scripts-deploy/

      - name: Deploy scripts de respaldo via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     3.137.152.75
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source:   'scripts-deploy/*'
          target:   '/home/ubuntu/scripts/'
          strip_components: 1

      # ── EC2: deploy ATÓMICO — migrar → validar esquema → reload ──────────────
      #
      # GARANTÍA: pm2 reload NUNCA ocurre si las migraciones o la validación
      # de esquema fallan. El proceso anterior sigue vivo e intacto.
      #
      # AUTO-ROLLBACK: si el health check post-reload falla, se restaura
      # automáticamente la versión anterior sin intervención manual.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Setup + Migrate + Validate + Restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_CA_CERT:       ${{ secrets.DB_CA_CERT }}
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:      ${{ secrets.SMTP_SECURE }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SMTP_FROM:        ${{ secrets.SMTP_FROM }}
          NOTIF_ADMIN_EMAIL: ${{ secrets.NOTIF_ADMIN_EMAIL }}
          # Seguro aunque el secreto no exista: el bloque [PRE] del script hace
          # unset de las que llegan vacías, así que no pueden pisar el .env.
          SENTRY_DSN:       ${{ secrets.SENTRY_DSN }}

          # ── FUENTE ÚNICA de la lista de variables inyectadas ────────────────
          # Se define AQUÍ y en ningún sitio más. `envs:` la referencia y el
          # script la recibe como una variable más, así que el bloque [PRE]
          # itera exactamente lo que se inyecta, sin copiarlo.
          #
          # Antes esta lista estaba escrita TRES veces (envs:, el unset y el
          # listado del log). Mantenerlas sincronizadas a mano era cuestión de
          # tiempo: el día que alguien añadiera la décima variable y olvidara
          # una de las copias, el incidente volvía idéntico.
          #
          # Al añadir una variable nueva basta con ponerla aquí y en el `env:`
          # de arriba. Si se olvida aquí, no se inyecta — que es el lado seguro:
          # gana el .env del servidor, que es el estado que ya funcionaba.
          VARS_INYECTADAS: DB_CA_CERT,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,SMTP_FROM,NOTIF_ADMIN_EMAIL,SENTRY_DSN
        with:
          host:            3.137.152.75
          username:        ubuntu
          key:             ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          # La propia lista viaja al servidor para que el script pueda iterarla.
          envs:            ${{ env.VARS_INYECTADAS }},VARS_INYECTADAS
          timeout:         900s
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/hicloud

            # ══════════════════════════════════════════════════════════════════
            # [PRE] DESCARTAR VARIABLES VACÍAS — 45 min de caída en producción
            # ══════════════════════════════════════════════════════════════════
            #
            # `envs:` del ssh-action exporta al shell remoto TODAS las variables
            # listadas, exista o no el secreto. Si no existe, llega como cadena
            # VACÍA — no ausente. Y a partir de ahí:
            #
            #   1. `pm2 reload --update-env` le pasa ese entorno al proceso.
            #   2. dotenv NO pisa variables que ya están en process.env, así que
            #      el .env del servidor no puede ganar: queda anulado.
            #   3. Joi valida el formato de un valor que SÍ está presente. Un
            #      `.uri()` o un `.number()` rechazan la cadena vacía y Nest se
            #      niega a arrancar.
            #
            # Eso fue el incidente: se añadió SENTRY_DSN a `envs:` antes de crear
            # el secreto, llegó vacío, pisó el .env y Joi tumbó el arranque. El
            # `.env` estaba bien; editarlo a mano no servía de nada porque la
            # variable del shell mandaba.
            #
            # Omitir la variable deja que gane el .env. Escribirla vacía lo pisa.
            # Se aplica a TODAS, no solo a la que explotó: la próxima que alguien
            # añada con el secreto sin cargar repetiría el incidente igual.
            # La lista NO se repite aquí: llega en VARS_INYECTADAS, la misma que
            # alimenta `envs:`. Una sola definición, imposible desincronizar.
            echo "━━━ [PRE] Saneando variables de entorno inyectadas ━━━"
            _LISTA=$(echo "${VARS_INYECTADAS:-}" | tr ',' ' ')
            if [ -z "$_LISTA" ]; then
              # No debería pasar nunca. Si pasa, ninguna variable se inyectó y
              # manda el .env del servidor — el estado seguro. Se avisa igual
              # porque significa que la expresión de `envs:` no se resolvió.
              echo "  ⚠️  VARS_INYECTADAS vacía — no se saneó nada; el proceso usará el .env"
            fi
            for _var in $_LISTA; do
              eval "_val=\${$_var:-}"
              if [ -z "$_val" ]; then
                unset "$_var"
                echo "  ↷ $_var vacía — se omite (gana el .env del servidor)"
              fi
            done
            echo "  → Variables que SÍ llegan al proceso:"
            for _var in $_LISTA; do
              eval "_val=\${$_var:-}"
              # Solo el nombre y la longitud: nunca el valor, que son secretos.
              [ -n "$_val" ] && echo "      $_var (${#_val} caracteres)"
            done
            echo "  (las omitidas se toman del .env del servidor, si están ahí)"

            # ══════════════════════════════════════════════════════════════════
            # [0/6] GUARDAR ESTADO ESTABLE — ANTES de cualquier cambio
            # ══════════════════════════════════════════════════════════════════
            echo "━━━ [0/6] Guardar estado estable ━━━"
            STABLE_COMMIT=$(git rev-parse HEAD)
            BACKEND_DIR="/home/ubuntu/hicloud/hi-cloud backend-project/backend"

            echo "  → Commit estable: $STABLE_COMMIT"
            # Backup del dist actual para poder hacer rollback post-reload
            if [ -d "$BACKEND_DIR/dist" ]; then
              rm -rf /home/ubuntu/hicloud/.backup-dist
              cp -r "$BACKEND_DIR/dist" /home/ubuntu/hicloud/.backup-dist
              echo "  ✅ Backup dist guardado (~$(du -sh /home/ubuntu/hicloud/.backup-dist 2>/dev/null | cut -f1))"
            else
              echo "  ⚠  No hay dist previo (primer deploy)"
            fi

            # ══════════════════════════════════════════════════════════════════
            # [1/6] GIT SYNC
            # ══════════════════════════════════════════════════════════════════
            echo "━━━ [1/6] Git sync ━━━"
            git fetch origin main
            git reset --hard origin/main

            # ══════════════════════════════════════════════════════════════════
            # [2/6] VARIABLES DE ENTORNO
            # ══════════════════════════════════════════════════════════════════
            echo "━━━ [2/6] Variables de entorno ━━━"
            ENV_FILE="hi-cloud backend-project/backend/.env"

            if grep -q '^APP_URL=' "$ENV_FILE" 2>/dev/null; then
              sed -i 's|^APP_URL=.*|APP_URL=https://hicloudrd.com|' "$ENV_FILE"
            else
              echo 'APP_URL=https://hicloudrd.com' >> "$ENV_FILE"
            fi

            if grep -q '^FRONTEND_URL=' "$ENV_FILE" 2>/dev/null; then
              sed -i 's|^FRONTEND_URL=.*|FRONTEND_URL=https://hicloudrd.com|' "$ENV_FILE"
            else
              echo 'FRONTEND_URL=https://hicloudrd.com' >> "$ENV_FILE"
            fi

            # S-25: DB_CA_CERT — fuente de verdad: PEM file en el servidor.
            CERT_VALUE=""
            if [ -f /home/ubuntu/us-east-2-bundle.pem ]; then
              CERT_VALUE=$(base64 -w 0 /home/ubuntu/us-east-2-bundle.pem 2>/dev/null || echo "")
              if [ -n "$CERT_VALUE" ] && [ "${#CERT_VALUE}" -gt 200 ]; then
                echo "  → DB_CA_CERT: PEM file OK (${#CERT_VALUE} chars)"
              else
                echo "  ⚠️  DB_CA_CERT: PEM file presente pero base64 vacío — intentando GitHub Secret"
                CERT_VALUE=""
              fi
            else
              echo "  ⚠️  DB_CA_CERT: /home/ubuntu/us-east-2-bundle.pem no encontrado — intentando GitHub Secret"
            fi
            if [ -z "$CERT_VALUE" ] && [ -n "$DB_CA_CERT" ] && [ "${#DB_CA_CERT}" -gt 200 ]; then
              CERT_VALUE="$DB_CA_CERT"
              echo "  → DB_CA_CERT: usando GitHub Secret (${#CERT_VALUE} chars)"
            fi
            if [ -n "$CERT_VALUE" ] && [ "${#CERT_VALUE}" -gt 200 ]; then
              python3 -c "import sys,re; e,cert=sys.argv[1],sys.argv[2]; buf=open(e).read(); buf=re.sub(r'(?m)^DB_CA_CERT=.*','DB_CA_CERT='+cert,buf) if re.search(r'(?m)^DB_CA_CERT=',buf) else buf+chr(10)+'DB_CA_CERT='+cert; open(e,'w').write(buf); print('  DB_CA_CERT ok '+str(len(cert))+' chars')" "$ENV_FILE" "$CERT_VALUE"
              echo "  ✅ DB_CA_CERT actualizado"
            fi

            if grep -q '^GOOGLE_CALLBACK_URL=' "$ENV_FILE" 2>/dev/null; then
              sed -i 's|^GOOGLE_CALLBACK_URL=.*|GOOGLE_CALLBACK_URL=https://hicloudrd.com/api/v1/auth/google/callback|' "$ENV_FILE"
            else
              echo 'GOOGLE_CALLBACK_URL=https://hicloudrd.com/api/v1/auth/google/callback' >> "$ENV_FILE"
            fi

            inject_env() {
              local key="$1" val="$2"
              [ -z "$val" ] && return
              if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                local escaped; escaped=$(printf '%s\n' "$val" | sed 's|[&\\/]|\\&|g; s/|/\\|/g')
                sed -i "s|^${key}=.*|${key}=${escaped}|" "$ENV_FILE"
              else
                echo "${key}=${val}" >> "$ENV_FILE"
              fi
            }
            inject_env SMTP_HOST        "$SMTP_HOST"
            inject_env SMTP_PORT        "$SMTP_PORT"
            inject_env SMTP_SECURE      "$SMTP_SECURE"
            inject_env SMTP_USER        "$SMTP_USER"
            inject_env SMTP_PASS        "$SMTP_PASS"
            inject_env SMTP_FROM        "$SMTP_FROM"
            inject_env NOTIF_ADMIN_EMAIL "$NOTIF_ADMIN_EMAIL"
            inject_env SEED_PLAN_CUENTAS_RUN "true"
            # Release de Sentry = SHA del commit recién desplegado (HEAD tras el git reset).
            # Permite atribuir cada error al deploy que lo introdujo.
            inject_env SENTRY_RELEASE "$(git rev-parse HEAD)"
            # Si el secreto no está cargado, [PRE] ya hizo unset y inject_env
            # sale por su guard de valor vacío: el .env queda intacto.
            inject_env SENTRY_DSN     "${SENTRY_DSN:-}"
            echo "  ✅ Variables de entorno configuradas"

            # Chromium para Puppeteer
            set +e
            if ! command -v chromium-browser > /dev/null 2>&1 \
            && ! command -v google-chrome    > /dev/null 2>&1 \
            && ! command -v chromium         > /dev/null 2>&1; then
              apt-get install -y -q chromium-browser 2>/dev/null \
                || apt-get install -y -q chromium 2>/dev/null \
                || true
            fi
            CHROME_PATH=$(command -v google-chrome-stable 2>/dev/null \
              || command -v google-chrome    2>/dev/null \
              || command -v chromium-browser 2>/dev/null \
              || command -v chromium         2>/dev/null \
              || echo "")
            if [ -n "$CHROME_PATH" ]; then
              grep -q '^PUPPETEER_EXECUTABLE_PATH=' "$ENV_FILE" 2>/dev/null \
                && sed -i "s|^PUPPETEER_EXECUTABLE_PATH=.*|PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}|" "$ENV_FILE" \
                || echo "PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}" >> "$ENV_FILE"
              echo "  ✅ Chromium del sistema: ${CHROME_PATH}"
            else
              echo "  ⚠️  Sin Chromium del sistema — puppeteer usará el Chrome que descargue npm ci"
            fi
            set -e

            # ── Respaldos: permisos + cron ────────────────────────────────────
            # Los scripts acaban de subirse por SCP. Aquí se les da permiso de
            # ejecución y se garantiza que el cron existe.
            #
            # Hasta ahora esto dependía de que alguien lo hubiera puesto a mano
            # en su día: nadie sabía si el cron seguía ahí, y la única señal de
            # que no estaba habría sido descubrirlo al necesitar restaurar.
            #
            # NO tumba el deploy si falla. Un cron de respaldo es importante,
            # pero no es motivo para dejar el ERP sin desplegar.
            set +e
            if [ -d /home/ubuntu/scripts ]; then
              chmod +x /home/ubuntu/scripts/*.sh 2>/dev/null

              CRON_BACKUP="0 2 * * * /home/ubuntu/scripts/backup-hicloud.sh >> /var/log/hicloud-backup.log 2>&1"
              CRON_VERIF="30 3 * * 0 /home/ubuntu/scripts/verificar-backup.sh >> /var/log/hicloud-backup.log 2>&1"

              # Se trabaja sobre ficheros, no sobre cadenas multilínea: dentro
              # de un bloque YAML la indentación se cuela en el valor y ya rompió
              # este workflow una vez.
              crontab -l > /tmp/cron.actual 2>/dev/null || : > /tmp/cron.actual
              cp /tmp/cron.actual /tmp/cron.nuevo
              CAMBIO=0

              # Idempotente: se compara por la RUTA del script, no por la línea
              # entera. Así un cambio de horario hecho a mano en el servidor se
              # respeta en vez de duplicar la entrada en cada deploy.
              if ! grep -q "backup-hicloud.sh" /tmp/cron.actual; then
                echo "$CRON_BACKUP" >> /tmp/cron.nuevo
                CAMBIO=1
                echo "  ➕ cron: backup diario 02:00 instalado"
              fi
              if ! grep -q "verificar-backup.sh" /tmp/cron.actual; then
                echo "$CRON_VERIF" >> /tmp/cron.nuevo
                CAMBIO=1
                echo "  ➕ cron: verificación semanal domingo 03:30 instalada"
              fi

              if [ "$CAMBIO" = "1" ]; then
                crontab /tmp/cron.nuevo \
                  && echo "  ✅ crontab actualizado" \
                  || echo "  ⚠️  No se pudo escribir el crontab — instalar a mano"
              fi
              rm -f /tmp/cron.actual /tmp/cron.nuevo

              # Verificación explícita: que el deploy DIGA si el respaldo está
              # programado. Sin esto volveríamos a no saberlo.
              if crontab -l 2>/dev/null | grep -q "backup-hicloud.sh"; then
                echo "  ✅ respaldo programado: $(crontab -l 2>/dev/null | grep backup-hicloud.sh | head -1)"
              else
                echo "  🚨 NO HAY CRON DE RESPALDO — la base no se está respaldando"
              fi
              if [ ! -f /home/ubuntu/scripts/backup-hicloud.sh ]; then
                echo "  🚨 backup-hicloud.sh NO está en el servidor"
              fi
            else
              echo "  🚨 /home/ubuntu/scripts no existe — el SCP de scripts falló"
            fi
            set -e

            # ── nginx: /sw.js NUNCA cacheado ──────────────────────────────────
            # El service worker no lleva hash en el nombre, pero cae en la regla
            # de /assets y sale con max-age=31536000, immutable. Un navegador que
            # se quede con un sw.js viejo nunca ejecuta `activate`: no purga
            # cachés y sigue sirviendo lo que tenga guardado, indefinidamente.
            #
            # Idempotente (solo actúa si el bloque no está) y con red de
            # seguridad: backup, `nginx -t`, y si la validación falla se
            # restaura el backup y el deploy CONTINÚA. Una cabecera de caché no
            # puede tumbar un despliegue.
            # El deploy corre como `ubuntu`; /etc/nginx y `nginx -s reload`
            # necesitan root. En EC2 Ubuntu el usuario tiene sudo NOPASSWD.
            set +e
            if ! sudo -n true 2>/dev/null; then
              echo "  ⚠️  nginx: sin sudo sin contraseña — /sw.js sigue cacheable (aplicar a mano)"
            else
            # -R (no -r): sites-enabled son SYMLINKS a sites-available y `grep -r`
            # NO los sigue. Ese fue el motivo de que las dos primeras versiones de
            # este bloque no encontraran nada. Se busca también en nginx.conf y en
            # sites-available por si el vhost no está enlazado de forma estándar.
            NGX_CONF=$(sudo grep -Rl "/var/www/hicloudrd.com/html" \
                         /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ \
                         /etc/nginx/conf.d/ /etc/nginx/nginx.conf 2>/dev/null | head -1)
            if [ -z "$NGX_CONF" ]; then
              echo "  ⚠️  nginx: no se encontró el vhost de hicloudrd.com — /sw.js sigue cacheable"
              echo "     (buscado en sites-enabled, sites-available, conf.d y nginx.conf)"
              sudo ls -la /etc/nginx/sites-enabled/ 2>/dev/null | head -5
            elif sudo grep -q "location = /sw.js" "$NGX_CONF"; then
              echo "  ✅ nginx: /sw.js ya tiene su regla no-store"
            else
              echo "  → nginx: vhost encontrado en $NGX_CONF"
              NGX_BAK="${NGX_CONF}.bak-$(date +%Y%m%d%H%M%S)"
              sudo cp "$NGX_CONF" "$NGX_BAK"
              # Ancla: la directiva `root` del vhost, que está dentro del server
              # block correcto. El bloque se inserta justo después.
              sudo awk '
                !hecho && /root[[:space:]]+\/var\/www\/hicloudrd\.com\/html/ {
                  print
                  print ""
                  print "    # El service worker no lleva hash: si se cachea, queda uno viejo activo."
                  print "    location = /sw.js {"
                  print "        add_header Cache-Control \"no-store, no-cache, must-revalidate\" always;"
                  print "        expires -1;"
                  print "    }"
                  hecho = 1
                  next
                }
                { print }
              ' "$NGX_BAK" | sudo tee "$NGX_CONF" > /dev/null

              # Si el awk no encontró el ancla, el fichero sale idéntico: no
              # tocamos nginx ni recargamos por nada.
              if sudo cmp -s "$NGX_BAK" "$NGX_CONF"; then
                echo "  ⚠️  nginx: no se encontró la directiva 'root' donde anclar el bloque"
                sudo grep -n "hicloudrd.com/html" "$NGX_CONF" | head -3
              elif sudo nginx -t > /dev/null 2>&1; then
                sudo nginx -s reload && echo "  ✅ nginx: /sw.js ahora se sirve no-store (backup: $NGX_BAK)"
              else
                sudo cp "$NGX_BAK" "$NGX_CONF"
                echo "  ⚠️  nginx -t falló con el bloque de /sw.js — config restaurada, deploy continúa"
                sudo nginx -t 2>&1 | tail -3
              fi
            fi
            fi
            set -e

            # ══════════════════════════════════════════════════════════════════
            # [3/6] DEPS + DIST + MIGRACIONES
            # Si cualquier paso falla AQUÍ, el proceso anterior sigue vivo
            # (pm2 reload NO ha ocurrido todavía).
            # ══════════════════════════════════════════════════════════════════
            echo "━━━ [3/6] Deps + dist + migraciones ━━━"
            cd "$BACKEND_DIR"

            if [ ! -f /home/ubuntu/hicloud/backend-dist-ci/main.js ]; then
              echo "❌ Backend dist no recibido del CI — abortando"
              exit 1
            fi

            # Si el servidor ya tiene Chromium del sistema (el caso normal, ver
            # [2/6]), puppeteer lo usa vía PUPPETEER_EXECUTABLE_PATH y el Chrome
            # que baja su postinstall no se ejecuta jamás. Saltar esa descarga
            # ahorra ~150 MB por deploy y — más importante — quita del camino
            # crítico una llamada a storage.googleapis.com que ya devolvió 403 y
            # tumbó un deploy (chrome v147.0.7727.57, run 32433927389).
            #
            # Si NO hay Chromium del sistema, se permite la descarga: es el único
            # respaldo para que los PDFs sigan funcionando. Mejor un deploy lento
            # que un deploy sin capacidad de generar documentos.
            if [ -n "$CHROME_PATH" ]; then
              export PUPPETEER_SKIP_DOWNLOAD=true
              echo "  ↷ npm ci sin descarga de Chrome (se usa el del sistema)"
            fi
            npm ci 2>&1 | tail -3

            # Activar el nuevo dist (PM2 todavía ejecuta el ANTERIOR)
            rm -rf dist
            mv /home/ubuntu/hicloud/backend-dist-ci dist

            ln -sfn "$BACKEND_DIR" /home/ubuntu/hicloud/backend-current

            # FIX CRÍTICO: dotenv no overridea env vars del shell de GitHub Actions
            if [ -n "$CERT_VALUE" ] && [ "${#CERT_VALUE}" -gt 200 ]; then
              export DB_CA_CERT="$CERT_VALUE"
              echo "  DB_CA_CERT exportado al entorno de node"
            fi

            # ──────────────────────────────────────────────────────────────────
            # CAPA 0: Validar DataSource metadata ANTES de correr migraciones
            #
            # Detecta DataTypeNotSupportedError (columnas con union type sin
            # type: explícito, enums sin type:'enum', etc.) en las entidades
            # del NUEVO dist, antes de tocar la BD.
            #
            # Sin este check, el error ocurre dentro del runner de migraciones
            # y el mensaje queda enterrado. Con este check aparece explícito.
            # ──────────────────────────────────────────────────────────────────
            echo "  → Validando metadata de entidades TypeORM..."
            CAPA0_OUT=$(timeout 90 node -e "
              const { AppDataSource } = require('./dist/data-source');
              AppDataSource.initialize()
                .then(ds => {
                  const n = ds.entityMetadatas.length;
                  console.log('  ✅ DataSource OK —', n, 'entidades cargadas');
                  return ds.destroy();
                })
                .then(() => process.exit(0))
                .catch(err => {
                  console.error('  ❌ DataSource.initialize() falló:', err.message);
                  console.error('  STACK:', err.stack);
                  process.exit(1);
                });
            " 2>&1)
            CAPA0_EXIT=$?
            echo "$CAPA0_OUT"
            if [ $CAPA0_EXIT -ne 0 ]; then
              echo "❌ CAPA 0: DataSource metadata inválido — abortando ANTES de correr migraciones"
              echo "  → Salida completa:"
              echo "$CAPA0_OUT"
              echo "  → Exit code: $CAPA0_EXIT (124 = timeout de 90s, 1 = error en node)"
              rm -rf dist
              if [ -d /home/ubuntu/hicloud/.backup-dist ]; then
                cp -r /home/ubuntu/hicloud/.backup-dist dist
              fi
              exit 1
            fi

            echo "  → Corriendo migraciones pendientes..."
            node -e "
              const { AppDataSource } = require('./dist/data-source');
              AppDataSource.initialize()
                .then(ds => ds.runMigrations({ transaction: 'each' }))
                .then(migs => {
                  if (migs.length === 0) { console.log('  ✅ Sin migraciones pendientes'); }
                  else { console.log('  ✅ Migraciones aplicadas:', migs.map(m=>m.name).join(', ')); }
                  process.exit(0);
                })
                .catch(err => {
                  console.error('  ❌ Migración falló:', err.message);
                  console.error('  STACK:', err.stack);
                  process.exit(1);
                });
            " || {
              echo "❌ Migraciones fallaron — abortando deploy sin reload"
              echo "  → El proceso anterior sigue activo e intacto"
              echo "  → Restaurando dist anterior en disco..."
              rm -rf dist
              if [ -d /home/ubuntu/hicloud/.backup-dist ]; then
                cp -r /home/ubuntu/hicloud/.backup-dist dist
              fi
              exit 1
            }

            # ══════════════════════════════════════════════════════════════════
            # [4/6] VALIDACIÓN DE ESQUEMA PRE-RELOAD (CAPA 1)
            #
            # Compara entity metadata del NUEVO dist vs columnas reales en BD.
            # Si hay columnas nuevas sin migrar → ABORT sin tocar PM2.
            # El proceso anterior sigue sirviendo requests normalmente.
            #
            # Esto habría PREVENIDO el incidente del 2026-07-01:
            # descuentoGeneralPct/Monto en entity sin columnas en BD →
            # este check habría fallado ANTES del reload.
            # ══════════════════════════════════════════════════════════════════
            echo "━━━ [4/6] Validación de esquema pre-reload ━━━"
            node scripts/check-schema-dist.js || {
              echo "❌ Esquema inconsistente — deploy abortado ANTES del reload"
              echo "  → El proceso anterior sigue activo e intacto"
              echo "  → Diagnóstico: una columna nueva en entity no tiene migración"
              echo "  → Solución: agrega la migración en src/migrations/ y re-deploya"
              rm -rf dist
              if [ -d /home/ubuntu/hicloud/.backup-dist ]; then
                cp -r /home/ubuntu/hicloud/.backup-dist dist
              fi
              git reset --hard "$STABLE_COMMIT"
              exit 1
            }

            # ══════════════════════════════════════════════════════════════════
            # [5/6] PM2 RELOAD — solo si [3] y [4] pasaron
            # ══════════════════════════════════════════════════════════════════
            echo "━━━ [5/6] PM2 reload ━━━"
            # --max-old-space-size limita el heap de V8 a 512 MB.
            # Sin esto, Node puede crecer hasta que el OOM-killer lo mata.
            export NODE_OPTIONS="--max-old-space-size=512"
            if ! pm2 list | grep -q hicloud-backend; then
              # Sin --interpreter: PM2 reconoce un .js y usa node por su cuenta.
              # Pasarlo explícitamente solo añade una forma de romper cuando hay
              # espacios en las rutas, y aquí los hay ("hi-cloud backend-project").
              pm2 start /home/ubuntu/hicloud/backend-current/dist/main.js \
                --name hicloud-backend \
                --cwd /home/ubuntu/hicloud/backend-current \
                --node-args="--max-old-space-size=512"
            else
              # --update-env es obligatorio: sin él PM2 reutiliza el entorno
              # cacheado del arranque y ningún cambio de variables surte efecto.
              # Eso fue lo que hizo perder tiempo durante el incidente — se
              # editaba el .env y el proceso seguía con los valores viejos.
              pm2 reload hicloud-backend --update-env
            fi
            pm2 save
            sleep 20

            # ══════════════════════════════════════════════════════════════════
            # [6/6] HEALTH CHECK + AUTO-ROLLBACK (CAPA 2)
            #
            # Si el health check falla tras el reload, el deploy restaura
            # automáticamente la versión anterior y recarga PM2.
            # Producción vuelve a estar operativa en ~15s sin intervención.
            # ══════════════════════════════════════════════════════════════════
            echo "━━━ [6/6] Health check ━━━"

            # Deshabilitar set -e para que el else (rollback) se ejecute completo
            set +e

            STATUS="error"
            for i in 1 2 3 4 5; do
              STATUS=$(curl -sk --max-time 10 https://hicloudrd.com/api/v1/health | \
                python3 -c "import sys,json; print(json.load(sys.stdin)['data']['status'])" 2>/dev/null || echo "error")
              echo "  Intento $i/5: $STATUS"
              if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
                break
              fi
              [ "$i" -lt 5 ] && sleep 6
            done

            # Admin smoke-test: 401=OK (auth required), 500=FAIL (SQL/runtime error)
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
              for ADMIN_EP in "admin/metricas" "admin/pagos-suscripcion/resumen-cobros" "admin/pagos-suscripcion/comprobantes-pendientes"; do
                ADMIN_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 "https://hicloudrd.com/api/v1/$ADMIN_EP")
                echo "  Admin smoke-test /$ADMIN_EP: HTTP $ADMIN_CODE"
                if [ "$ADMIN_CODE" = "500" ]; then
                  echo "  ❌ /$ADMIN_EP devolvió 500 — forzando rollback"
                  STATUS="error"
                  break
                fi
              done
            fi

            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
              # ── Deploy exitoso ────────────────────────────────────────────
              echo "✅ Deploy exitoso — servidor $STATUS"
              # Guardar este commit como último estable
              git rev-parse HEAD > /home/ubuntu/hicloud/.last-stable-commit
              # Desactivar re-sembrado para próximos reinicios
              sed -i 's|^SEED_PLAN_CUENTAS_RUN=.*|SEED_PLAN_CUENTAS_RUN=false|' "$ENV_FILE" 2>/dev/null || true
              echo "  SEED_PLAN_CUENTAS_RUN desactivado"

              # ── Limpieza de assets viejos ─────────────────────────────────
              # scp sin -p refresca el mtime de TODOS los archivos del build
              # actual en cada deploy (verificado 2026-08-05: los 3 assets del
              # index.html vigente aparecen con Aug 5 15:16 incluso siendo
              # vendor-antd que no cambió entre builds).
              # → mtime > 7 días = archivo de build anterior, no en uso.
              # → find -mtime +7 -delete es seguro.
              # timeout 90s para que la primera pasada grande no cuelgue el deploy.
              ASSET_DIR="/var/www/hicloudrd.com/html/assets"
              BEFORE=$(find "$ASSET_DIR" -type f 2>/dev/null | wc -l)
              DELETED=$(timeout 90 find "$ASSET_DIR" -type f -mtime +7 -delete -print 2>/dev/null | wc -l || echo "0 (timeout)")
              REMAINING=$(find "$ASSET_DIR" -type f 2>/dev/null | wc -l)
              SIZE=$(du -sh "$ASSET_DIR" 2>/dev/null | cut -f1)
              echo "  → Assets: antes=${BEFORE} eliminados=${DELETED} restantes=${REMAINING} (${SIZE})"

            else
              # ── AUTO-ROLLBACK ──────────────────────────────────────────────
              echo ""
              echo "⚠️  ════════════════════════════════════════════════════"
              echo "⚠️  HEALTH CHECK FALLÓ — INICIANDO AUTO-ROLLBACK"
              echo "⚠️  ════════════════════════════════════════════════════"
              echo "  → Health check: $STATUS"
              echo "  → Restaurando versión $STABLE_COMMIT..."
              echo ""

              # Imprimir logs del proceso fallido para diagnóstico
              pm2 logs hicloud-backend --lines 50 --nostream 2>/dev/null || true
              echo ""

              # Restaurar código fuente al commit anterior
              git reset --hard "$STABLE_COMMIT" 2>/dev/null || true

              # Restaurar dist anterior
              cd "$BACKEND_DIR"
              if [ -d /home/ubuntu/hicloud/.backup-dist ]; then
                rm -rf dist
                cp -r /home/ubuntu/hicloud/.backup-dist dist
                echo "  ✅ Dist anterior restaurado"
              else
                echo "  ⚠  No hay backup dist — PM2 intentará recargar con lo disponible"
              fi

              # Recargar PM2 con el dist anterior
              # --update-env también en el fallback: es el camino de EMERGENCIA,
              # justo donde el entorno cacheado hace más daño. Sin él, un
              # rollback puede levantar el código viejo con las variables nuevas.
              pm2 reload hicloud-backend --update-env 2>/dev/null || \
                pm2 restart hicloud-backend --update-env 2>/dev/null || \
                echo "  ⚠  pm2 reload/restart falló — proceso puede estar corrupto"
              pm2 save 2>/dev/null || true

              # ── VERIFICAR QUE EL SERVICIO VOLVIÓ DE VERDAD ─────────────────
              #
              # Un rollback que no comprueba que el servicio responde no es un
              # rollback: es un reinicio con esperanza. Esto fue el incidente —
              # el rollback restauró el build bueno sobre un proceso que seguía
              # muerto (el entorno cacheado de PM2 conservaba la variable que lo
              # mataba), reportó "restaurado" y la producción siguió caída.
              #
              # Se usa /version y no /health a propósito: no toca base de datos,
              # así que mide si el PROCESO responde, no si la BD está rápida.
              esperar_servicio() {
                _i=0
                while [ $_i -lt 12 ]; do   # 12 × 5 s = hasta 60 s
                  if curl -sfk --max-time 5 https://hicloudrd.com/api/v1/version > /dev/null 2>&1; then
                    return 0
                  fi
                  _i=$((_i + 1))
                  sleep 5
                done
                return 1
              }

              echo "  → Verificando que el servicio responde..."
              if esperar_servicio; then
                ROLLBACK_STATUS="healthy"
              else
                # Escalada: reload/restart reutilizan el proceso y su entorno
                # cacheado. delete + start crea uno nuevo desde cero, que es lo
                # que resolvió el incidente a mano.
                echo ""
                echo "  ⚠️  El servicio NO responde tras el reload — escalando a delete + start"
                pm2 delete hicloud-backend 2>/dev/null || true
                pm2 start /home/ubuntu/hicloud/backend-current/dist/main.js \
                  --name hicloud-backend \
                  --cwd /home/ubuntu/hicloud/backend-current \
                  --node-args="--max-old-space-size=512" 2>/dev/null || true
                pm2 save 2>/dev/null || true

                echo "  → Verificando de nuevo tras delete + start..."
                if esperar_servicio; then
                  ROLLBACK_STATUS="healthy"
                  echo "  ✅ Recuperado con delete + start"
                else
                  ROLLBACK_STATUS="caido"
                fi
              fi

              if [ "$ROLLBACK_STATUS" = "healthy" ] || [ "$ROLLBACK_STATUS" = "degraded" ]; then
                echo ""
                echo "✅ AUTO-ROLLBACK EXITOSO — Producción restaurada ($ROLLBACK_STATUS)"
                echo "  → Commit activo: $STABLE_COMMIT"
                echo "  → El deploy nuevo FALLÓ. Diagnosticar y corregir antes de re-deployar."
              else
                echo ""
                echo "❌ ═══════════════════════════════════════════════════════"
                echo "❌  ROLLBACK FALLIDO — PRODUCCIÓN CAÍDA"
                echo "❌ ═══════════════════════════════════════════════════════"
                echo ""
                echo "  El servicio NO responde ni tras restaurar el build anterior"
                echo "  ni tras recrear el proceso con delete + start."
                echo "  Los clientes NO pueden facturar ahora mismo."
                echo ""
                echo "  Últimos errores del proceso:"
                pm2 logs hicloud-backend --err --lines 40 --nostream 2>/dev/null || true
                echo ""
                echo "  ACCIÓN MANUAL URGENTE:"
                echo "    ssh ubuntu@3.137.152.75"
                echo "    pm2 list && pm2 logs hicloud-backend --err --lines 100"
                echo "    # Si el log señala una variable de entorno, quítala del .env:"
                echo "    cd '/home/ubuntu/hicloud/hi-cloud backend-project/backend'"
                echo "    pm2 delete hicloud-backend"
                echo "    pm2 start /home/ubuntu/hicloud/backend-current/dist/main.js \\"
                echo "      --name hicloud-backend --cwd /home/ubuntu/hicloud/backend-current"
              fi

              # El step termina con código 1 para que el workflow marque el deploy como fallido
              exit 1
            fi
