name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ── Backend: TypeScript + Build + Schema smoke test ──────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hi-cloud backend-project/backend

    # ── CAPA 3: PostgreSQL para smoke test de esquema ─────────────────────────
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     hicloud
          POSTGRES_PASSWORD: hicloud_ci
          POSTGRES_DB:       hicloud_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud backend-project/backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Security audit — deps (bloquea en high/critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Security patterns check
        run: bash scripts/security-check.sh

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'

      # ── CAPA 4: Detectar migraciones SQL en seeds/ ────────────────────────
      # Las migraciones DEBEN ser clases TypeScript en src/migrations/
      # NUNCA archivos .sql en seeds/ (TypeORM no los ejecuta automáticamente)
      # Este check habría prevenido el incidente del 2026-07-01.
      - name: "CAPA 4 — Detectar migraciones SQL en seeds/ (deben ser TS en migrations/)"
        run: |
          # --diff-filter=A: solo archivos AÑADIDOS (no modificaciones de SQL existentes)
          NEW_SQL=$(git diff --name-only --diff-filter=A HEAD~1 HEAD 2>/dev/null | \
            grep -E 'seeds/.*\.(sql|SQL)$' || true)

          if [ -n "$NEW_SQL" ]; then
            echo ""
            echo "❌ MIGRACIONES SQL DETECTADAS EN seeds/ — CI FALLIDO"
            echo "════════════════════════════════════════════════════════"
            echo "  Archivos detectados:"
            echo "$NEW_SQL" | sed 's/^/    /'
            echo ""
            echo "  ⛔ Los archivos .sql en seeds/ NO son ejecutados por TypeORM."
            echo "     El código nuevo llegaría a producción sin las columnas en BD."
            echo "     Resultado: SchemaValidator bloquea el arranque → backend caído."
            echo ""
            echo "  ✅ SOLUCIÓN: crea una migración TypeScript en src/migrations/"
            echo "     npm run migration:generate -- src/migrations/NombreDeTuCambio"
            echo ""
            echo "  📖 REGLA: TODA migración de schema va en src/migrations/*.ts"
            echo "     Seeds de datos van en src/seeds/ (no migrations de schema)"
            echo "════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "✅ Sin nuevas migraciones SQL en seeds/"

      # ── CAPA 3: Smoke test — migraciones + validación de esquema ─────────
      # Levanta BD de prueba, corre TODAS las migraciones, verifica que
      # el entity TypeORM coincida con la BD migrada.
      # Si un entity tiene columnas sin migración → CI FALLA antes del deploy.
      - name: "CAPA 3 — Smoke test: migraciones contra BD de prueba"
        run: |
          echo "  → Corriendo todas las migraciones contra BD de prueba..."
          node -e "
            const { AppDataSource } = require('./dist/data-source');
            AppDataSource.initialize()
              .then(ds => ds.runMigrations({ transaction: 'each' }))
              .then(migs => {
                console.log('  ✅ Migraciones OK:', migs.length, 'aplicadas');
                return AppDataSource.destroy();
              })
              .then(() => process.exit(0))
              .catch(err => {
                console.error('  ❌ Migración falló:', err.message);
                process.exit(1);
              });
          "
        env:
          NODE_ENV:      test
          DB_HOST:       localhost
          DB_PORT:       5432
          DB_USERNAME:   hicloud
          DB_PASSWORD:   hicloud_ci
          DB_NAME:       hicloud_test
          DB_SSL:        'false'
          # JWT_SECRET mínimo para que dotenv no falle (no se usa en migraciones)
          JWT_SECRET:    ci-test-secret-minimum-32-chars-placeholder

      - name: "CAPA 3 — Smoke test: validar entity vs BD migrada"
        run: |
          echo "  → Validando que todas las columnas del entity existen en BD migrada..."
          node scripts/check-schema-dist.js
        env:
          NODE_ENV:      test
          DB_HOST:       localhost
          DB_PORT:       5432
          DB_USERNAME:   hicloud
          DB_PASSWORD:   hicloud_ci
          DB_NAME:       hicloud_test
          DB_SSL:        'false'
          JWT_SECRET:    ci-test-secret-minimum-32-chars-placeholder

  # ── Frontend: TypeScript + Build ─────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hi-cloud frontend-project

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud frontend-project/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Security audit — deps (bloquea en critical)
        # xlsx@* tiene 2 high sin parche disponible en npm (SheetJS abandonó npm).
        # Bloqueamos en critical; los high de xlsx se revisan manualmente en cada release.
        run: npm audit --audit-level=critical --omit=dev

      - name: Build producción
        run: npm run build
        env:
          VITE_API_URL: /api/v1

  # ── Archivos críticos: check extra cuando se toca AppLayout / App / auth ──────
  critical-files:
    name: Check archivos críticos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar archivos críticos modificados
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD 2>/dev/null || echo "")
          echo "Archivos cambiados:"
          echo "$CHANGED"

          CRITICAL=false
          for f in AppLayout.tsx App.tsx main.tsx auth.service.ts tenant.middleware.ts; do
            if echo "$CHANGED" | grep -q "$f"; then
              echo "⚠️  ARCHIVO CRÍTICO MODIFICADO: $f"
              CRITICAL=true
            fi
          done

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT

      - name: Setup Node.js (si hay archivos críticos)
        if: steps.detect.outputs.critical == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud frontend-project/package-lock.json'

      - name: Build extra (archivo crítico modificado)
        if: steps.detect.outputs.critical == 'true'
        working-directory: hi-cloud frontend-project
        run: |
          echo "🔨 Build obligatorio por modificación de archivo crítico..."
          npm ci
          npm run build
          echo "✅ Build post-archivo-crítico OK"
        env:
          VITE_API_URL: /api/v1
