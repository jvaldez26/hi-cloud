name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ── Backend: TypeScript + Build + Schema checks ───────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hi-cloud backend-project/backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud backend-project/backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # ── Suite de tests ────────────────────────────────────────────────────
      # Sin este paso los tests no protegian nada: se escribian, se verificaban
      # en rojo en local, y CI no los ejecutaba nunca.
      #
      # Ejemplo de lo que estaba sin vigilar: siete-caminos.spec.ts fija que
      # ninguna factura llega a EMITIDA sin vendedor, por cualquiera de los
      # siete caminos que crean facturas. Habia 249 facturas con vendedorId
      # NULL en 11 empresas, invisibles para los cierres de caja. Hasta hoy,
      # un octavo camino sin resolver vendedor pasaba el CI sin ruido.
      #
      # Va en este job y no en uno aparte: la suite tarda ~15s en local y el
      # job entero esta en ~1min, muy por debajo del timeout-minutes de 10.
      #
      # Los specs que necesitan BD o credenciales (DB_HOST, MSeller) se
      # auto-skipean cuando no estan, asi que no hace falta darle secretos.
      - name: Tests
        run: npm test -- --ci

      - name: Security audit — deps (bloquea en high/critical)
        # || true: evita que un timeout de registry.npmjs.org (504) rompa el CI.
        run: npm audit --audit-level=high --omit=dev || true

      - name: Security patterns check
        run: bash scripts/security-check.sh

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'

      # ── CAPA 4: Detectar migraciones SQL en seeds/ ────────────────────────
      # Las migraciones DEBEN ser clases TypeScript en src/migrations/
      # NUNCA archivos .sql en seeds/ (TypeORM no los ejecuta automáticamente).
      # Este check habría prevenido el incidente del 2026-07-01.
      - name: "CAPA 4 — Detectar migraciones SQL en seeds/ (deben ser TS en migrations/)"
        run: |
          # --diff-filter=A: solo archivos AÑADIDOS (no modificaciones de SQL existentes)
          NEW_SQL=$(git diff --name-only --diff-filter=A HEAD~1 HEAD 2>/dev/null | \
            grep -E 'seeds/.*\.(sql|SQL)$' || true)

          if [ -n "$NEW_SQL" ]; then
            echo ""
            echo "❌ MIGRACIONES SQL DETECTADAS EN seeds/ — CI FALLIDO"
            echo "════════════════════════════════════════════════════════"
            echo "  Archivos detectados:"
            echo "$NEW_SQL" | sed 's/^/    /'
            echo ""
            echo "  ⛔ Los archivos .sql en seeds/ NO son ejecutados por TypeORM."
            echo "     El código nuevo llegaría a producción sin las columnas en BD."
            echo "     Resultado: SchemaValidator bloquea el arranque → backend caído."
            echo ""
            echo "  ✅ SOLUCIÓN: crea una migración TypeScript en src/migrations/"
            echo "     npm run migration:generate -- src/migrations/NombreDeTuCambio"
            echo ""
            echo "  📖 REGLA: TODA migración de schema va en src/migrations/*.ts"
            echo "     Seeds de datos van en src/seeds/ (no migrations de schema)"
            echo "════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "✅ Sin nuevas migraciones SQL en seeds/"

      # ── CAPA 3: Análisis estático — entity columns vs migrations ─────────
      # Verifica que cada columna en los entities esté cubierta por:
      #   a) Una migración TypeScript en src/migrations/
      #   b) El snapshot pre-baseline en scripts/baseline-columns.json
      #
      # Sin BD requerida. Detecta "columna en entity sin migración TypeScript"
      # antes de que llegue a producción.
      #
      # Hubiera atrapado el incidente del 2026-07-01:
      #   descuentoGeneralPct/Monto en entity pero la "migración" era un .sql en seeds/
      - name: "CAPA 3 — Verificar que columnas de entity tienen migración TypeScript"
        run: node scripts/check-entity-migrations.js

  # ── Frontend: TypeScript + Build ─────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hi-cloud frontend-project

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud frontend-project/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Security audit — deps (bloquea en critical)
        # xlsx@* tiene 2 high sin parche disponible en npm (SheetJS abandonó npm).
        # Bloqueamos en critical; los high de xlsx se revisan manualmente en cada release.
        # || true: evita que un timeout de registry.npmjs.org (504) rompa el CI.
        run: npm audit --audit-level=critical --omit=dev || true

      - name: Ticket compacto — ningún campo recortado
        # Salió a producción truncando el e-NCF y el subtotal en tickets reales:
        # la maqueta estaba dibujada más ancha que el papel. Esto lo afirma en
        # 58mm y 80mm sobre la plantilla real, sin necesidad de impresora.
        run: npm run verificar:compacto

      - name: Fechas en zona RD — nada se pinta con un día de menos
        # El frontend no tiene runner de tests: estos scripts transpilan el
        # módulo REAL con esbuild y lo ejecutan. Este corre con TZ forzado a
        # una zona que no es RD, que es el escenario a cubrir — la PC de una
        # caja con la zona mal puesta.
        run: npm run verificar:fechas

      - name: Ticket térmico del cierre — el bloque de facturas emitidas
        run: npm run verificar:termico

      - name: Subida de archivos — el FormData sale como multipart, no como JSON
        run: npm run verificar:subidas

      - name: Desenvolver respuestas — quien pide una lista recibe un array
        run: npm run verificar:desenvolver

      - name: Ejes de importe — RD$500 no son «1K» y 1,2 millones no son «1200K»
        run: npm run verificar:ejes

      - name: Dashboard configurable — cada gráfica trae su propia consulta
        run: npm run verificar:widgets

      - name: Verificar claves de videos tutoriales vs rutas
        run: node scripts/check-video-modulos.mjs

      - name: Build producción
        run: npm run build
        env:
          VITE_API_URL: /api/v1

  # ── Archivos críticos: check extra cuando se toca AppLayout / App / auth ──────
  critical-files:
    name: Check archivos críticos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar archivos críticos modificados
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD 2>/dev/null || echo "")
          echo "Archivos cambiados:"
          echo "$CHANGED"

          CRITICAL=false
          for f in AppLayout.tsx App.tsx main.tsx auth.service.ts tenant.middleware.ts; do
            if echo "$CHANGED" | grep -q "$f"; then
              echo "⚠️  ARCHIVO CRÍTICO MODIFICADO: $f"
              CRITICAL=true
            fi
          done

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT

      - name: Setup Node.js (si hay archivos críticos)
        if: steps.detect.outputs.critical == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'hi-cloud frontend-project/package-lock.json'

      - name: Build extra (archivo crítico modificado)
        if: steps.detect.outputs.critical == 'true'
        working-directory: hi-cloud frontend-project
        run: |
          echo "🔨 Build obligatorio por modificación de archivo crítico..."
          npm ci
          npm run build
          echo "✅ Build post-archivo-crítico OK"
        env:
          VITE_API_URL: /api/v1
