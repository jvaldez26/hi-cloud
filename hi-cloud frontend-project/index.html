<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-FOUC: aplicar data-theme ANTES de que React hidrate -->
    <!-- El default del sistema es SIEMPRE light — ignoramos prefers-color-scheme del OS.
         Solo se aplica dark si el usuario lo eligió explícitamente (preferencia guardada). -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('hicloud-theme');
          var dark = s ? JSON.parse(s).state.isDark === true : false;
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch(e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/logo-hicloud.svg" />
    <link rel="apple-touch-icon" href="/logo-hicloud.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1565C0" />
    <meta name="description" content="HiCloud ERP — Sistema ERP para PYMEs dominicanas. Facturación e-CF nativa, contabilidad, POS, nómina y más." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HiCloud ERP" />
    <!-- Open Graph -->
    <meta property="og:title" content="HiCloud ERP — El ERP para PYMEs dominicanas" />
    <meta property="og:description" content="Facturación electrónica e-CF nativa, contabilidad, POS y más. Cumplimiento DGII garantizado." />
    <meta property="og:image" content="https://hicloudrd.com/logo-hicloud.png" />
    <meta property="og:url" content="https://hicloudrd.com" />
    <meta property="og:type" content="website" />
    <title>HiCloud ERP</title>

    <!-- ── Fix iOS Safari: div raíz de página con ancho explícito ─────────
         Solo reglas quirúrgicas — selectores amplios div/span rompen tablas antd. -->
    <style>
      #root, #main-content { min-width: 0; width: 100%; }
      #main-content > div  { width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; }
    </style>

    <!-- ── Inter + Plus Jakarta Sans ───────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Spinner inicial: visible antes de que React hidrate.
           React lo reemplaza automáticamente al montar. -->
      <div id="app-loader" style="
        position:fixed;inset:0;display:flex;
        align-items:center;justify-content:center;
        background:#ffffff;z-index:9999;
      ">
        <style>
          .hc-dots{display:flex;gap:8px;align-items:center}
          .hc-dot{width:10px;height:10px;border-radius:50%;animation:hc-bounce 1.2s ease-in-out infinite}
          .hc-dot:nth-child(1){background:#93c5fd;animation-delay:0s}
          .hc-dot:nth-child(2){background:#60a5fa;animation-delay:.2s}
          .hc-dot:nth-child(3){background:#3b82f6;animation-delay:.4s}
          @keyframes hc-bounce{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1.2);opacity:1}}
        </style>
        <div class="hc-dots">
          <div class="hc-dot"></div>
          <div class="hc-dot"></div>
          <div class="hc-dot"></div>
        </div>
      </div>
    </div>
    <!-- Ajustar fondo del loader al modo oscuro (antes de que React hidrate) -->
    <script>
      (function(){try{var s=localStorage.getItem('hicloud-theme');if(s&&JSON.parse(s).state&&JSON.parse(s).state.isDark===true){var l=document.getElementById('app-loader');if(l)l.style.background='#0d1117';}}catch(e){}}());
    </script>

    <!--
      ── RED DE SEGURIDAD DEL ARRANQUE ────────────────────────────────────────
      Si el bundle principal no llega a ejecutarse (chunk borrado, red que se
      corta a mitad de la descarga, service worker devolviendo basura), React
      nunca monta y el #app-loader de arriba se queda fijo para siempre: un
      "Cargando..." eterno que sobrevive a F5 y que hasta ahora solo se
      arreglaba borrando los datos del sitio a mano.

      Este script existe para que eso no pueda pasar. Reglas que lo mantienen
      vivo cuando todo lo demás falla:

        - INLINE y sin dependencias. Si dependiera de algo que se descarga,
          moriría junto a lo que debe rescatar.
        - ES5 estricto: var, function, sin arrow, sin template literals, sin
          async/await. Los cajeros usan WebViews y navegadores viejos; si el
          parser no entiende la sintaxis, el script entero no corre y perdemos
          justo la red de seguridad.
        - Cada paso del rescate va en su propio try/catch y, pase lo que pase,
          se recarga igual.
    -->
    <script>
      (function () {
        var ESPERA_MS = 15000;

        function tema() {
          try {
            var s = localStorage.getItem('hicloud-theme');
            if (s && JSON.parse(s).state && JSON.parse(s).state.isDark === true) {
              return { bg: '#0d1117', fg: '#e6edf3', sub: '#8b949e', card: '#161b22', borde: '#30363d' };
            }
          } catch (e) {}
          return { bg: '#ffffff', fg: '#1e293b', sub: '#64748b', card: '#f8fafc', borde: '#e2e8f0' };
        }

        /* El rescate: exactamente lo que hoy se hace a mano (borrar datos del
           sitio), en un clic. Orden: desregistrar SW -> borrar cachés -> recargar. */
        function reintentar(boton) {
          try {
            if (boton) { boton.disabled = true; boton.textContent = 'Limpiando...'; }
          } catch (e) {}

          var recargado = false;
          function recargar() {
            if (recargado) return;
            recargado = true;
            try {
              /* Cache-buster para que ni el navegador ni un proxy intermedio
                 puedan devolver el index.html anterior. */
              location.replace(location.pathname + '?r=' + Date.now());
            } catch (e) {
              try { location.reload(); } catch (e2) {}
            }
          }

          var tareas = [];

          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              tareas.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  var us = [];
                  for (var i = 0; i < regs.length; i++) {
                    try { us.push(regs[i].unregister()); } catch (e) {}
                  }
                  return Promise.all(us);
                })
              );
            }
          } catch (e) {}

          try {
            if (window.caches && caches.keys) {
              tareas.push(
                caches.keys().then(function (claves) {
                  var ds = [];
                  for (var i = 0; i < claves.length; i++) {
                    try { ds.push(caches.delete(claves[i])); } catch (e) {}
                  }
                  return Promise.all(ds);
                })
              );
            }
          } catch (e) {}

          /* Si la limpieza cuelga (un SW roto puede no responder), recargamos
             igual a los 3 s: mejor recargar sin limpiar que no recargar. */
          try { setTimeout(recargar, 3000); } catch (e) {}

          try {
            if (tareas.length && window.Promise) {
              Promise.all(tareas).then(recargar)['catch'](recargar);
            } else {
              recargar();
            }
          } catch (e) {
            recargar();
          }
        }

        function mostrarFallo() {
          var c = tema();
          var cont = document.getElementById('app-loader');
          if (!cont) return;

          cont.style.background = c.bg;
          cont.innerHTML =
            '<div style="max-width:420px;padding:28px 24px;text-align:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">' +
              '<div style="font-size:40px;line-height:1;margin-bottom:14px;">&#9888;&#65039;</div>' +
              '<div style="font-size:18px;font-weight:700;color:' + c.fg + ';margin-bottom:8px;">' +
                'No se pudo cargar la aplicaci&oacute;n' +
              '</div>' +
              '<div style="font-size:13px;line-height:1.55;color:' + c.sub + ';margin-bottom:20px;">' +
                'Es posible que la conexi&oacute;n se haya interrumpido o que haya una versi&oacute;n nueva del sistema. ' +
                'Pulsa Reintentar: se limpian los datos guardados y se vuelve a cargar.' +
              '</div>' +
              '<button id="hc-reintentar" style="width:100%;height:44px;border:none;border-radius:10px;' +
                'background:#3B82F6;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">' +
                'Reintentar' +
              '</button>' +
              '<div style="margin-top:14px;font-size:11px;color:' + c.sub + ';">' +
                'Si el problema sigue, revisa la conexi&oacute;n a internet.' +
              '</div>' +
            '</div>';

          try {
            var b = document.getElementById('hc-reintentar');
            if (b) {
              b.onclick = function () { reintentar(b); };
            }
          } catch (e) {}
        }

        function comprobar() {
          /* Dos señales independientes de que React arrancó: la bandera que
             pone main.tsx y la desaparición del loader del DOM. Con que una
             se cumpla, no hay nada que rescatar. */
          try { if (window.__APP_MONTADA === true) return; } catch (e) {}
          try { if (!document.getElementById('app-loader')) return; } catch (e) {}
          mostrarFallo();
        }

        try { setTimeout(comprobar, ESPERA_MS); } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
