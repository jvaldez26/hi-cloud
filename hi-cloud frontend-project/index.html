<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-FOUC: aplicar data-theme ANTES de que React hidrate -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('hicloud-theme');
          var dark = s ? JSON.parse(s).state.isDark : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch(e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1565C0" />
    <meta name="description" content="HiCloud ERP — Sistema ERP para PYMEs dominicanas. Facturación e-CF nativa, contabilidad, POS, nómina y más." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HiCloud ERP" />
    <!-- Open Graph -->
    <meta property="og:title" content="HiCloud ERP — El ERP para PYMEs dominicanas" />
    <meta property="og:description" content="Facturación electrónica e-CF nativa, contabilidad, POS y más. Cumplimiento DGII garantizado." />
    <meta property="og:image" content="https://hicloudrd.com/logo-hicloud.png" />
    <meta property="og:url" content="https://hicloudrd.com" />
    <meta property="og:type" content="website" />
    <title>HiCloud ERP</title>

    <!-- ── Inter + Plus Jakarta Sans ───────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
